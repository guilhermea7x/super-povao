<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Padaria - Super Povão</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container Principal ampliado em mais de 1/3 (de 500px para 700px) */
        .panel-container {
            text-align: center;
            background-color: #ffffff;
            padding: 55px; /* Aumentado o espaçamento interno */
            border-radius: 16px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 700px; /* Aumentado substancialmente */
            margin: 20px;
        }

        /* Área do Logotipo ampliada */
        .logo-container {
            margin-bottom: 35px;
            height: 160px; /* Aumentado de 120px para 160px */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container img {
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
        }

        /* Títulos com fontes maiores */
        h1 {
            color: #333333;
            font-size: 32px; /* Aumentado de 24px para 32px */
            margin: 0 0 12px 0;
            letter-spacing: 0.5px;
        }

        p {
            color: #666666;
            font-size: 18px; /* Aumentado de 14px para 18px */
            margin: 0 0 45px 0;
        }

        /* Grupo de botões */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 20px; /* Mais espaço entre os botões */
        }

        /* Botões Maiores e mais imponentes */
        .panel-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background-color: #007bff;
            color: #ffffff;
            text-decoration: none;
            padding: 24px 32px; /* Aumentado consideravelmente para dar volume */
            font-size: 20px; /* Fonte aumentada de 16px para 20px */
            font-weight: bold;
            border-radius: 10px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 3px 6px rgba(0, 123, 255, 0.15);
        }

        .panel-btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .panel-btn:active {
            transform: translateY(1px);
        }

        /* Botão Secundário Verde */
        .panel-btn.secondary {
            background-color: #28a745;
            box-shadow: 0 3px 6px rgba(40, 167, 69, 0.15);
        }

        .panel-btn.secondary:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="panel-container">
        
        <!-- Espaço predefinido para a sua imagem de Logotipo -->
        <div class="logo-container">
            <img src="LOGO.png" alt="Logo Super Povão">
        </div>

        <h1>SUPER POVÃO</h1>
        <p>Selecione o formulário que deseja imprimir ou preencher:</p>

        <!-- Botões de navegação centralizados e ampliados -->
        <div class="button-group">
            
            <!-- Link para a página de Registro de Perdas -->
            <a href="MODELOS DE FOLHA PERDAS_PADARIA/index.html" class="panel-btn">
                <span>📋</span> REGISTRO DE PERDAS PADARIA
            </a>
            
            <!-- Link para a página de Uso/Consumo -->
            <a href="MODELOS DE FOLHA USO_CONSUMO PADARIA/index.html" class="panel-btn secondary">
                <span>🍞</span> REGISTRO DE USO/CONSUMO PADARIA
            </a>

        </div>

    </div>

</body>
</html>
